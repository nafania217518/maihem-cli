# Load with: maihem apply -f examples/stack.yaml
# The anthropic and openai images need ANTHROPIC_API_KEY / OPENAI_API_KEY at run time.
providers:
  ollama:
    kind: ollama
  anthropic:
    kind: anthropic
  openai:
    kind: openai
images:
  local-helper:
    provider: ollama
    model: qwen3.5:9b-mlx
    system: |
      You are a helpful assistant working in a directory.
      Use the tools to do what the user asks.
      Reply with the result only: no greeting, no summary of your steps.
    tools: [read, write, edit, list, exec]
    sandbox: true
    max_steps: 30
    reasoning: low
    context: 32000
  reviewer:
    provider: anthropic
    model: claude-sonnet-5-5
    system: |
      You review code. Read files, run checks with exec, and report findings.
      Do not change files unless asked.
    tools: [read, list, exec]
    sandbox: true
    max_steps: 50
  writer:
    provider: openai
    model: gpt-6-luna
    system: You write and edit documents in the working directory.
    tools: [read, write, edit, list]
    sandbox: false
    max_steps: 40
  translator:
    provider: ollama
    model: qwen3.5:9b-mlx
    tools: []
    system: |
      Translate the input into the language that the task names.
      Reply with the translation only: no greeting, no explanation, no markdown fences.
